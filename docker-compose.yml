services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lifediff
      POSTGRES_PASSWORD: lifediff
      POSTGRES_DB: lifediff
    ports:
      - "5432:5432"
    volumes:
      - lifediff_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  lifediff-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lifediff:lifediff@postgres:5432/lifediff
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  lifediff-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lifediff:lifediff@postgres:5432/lifediff
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  lifediff-frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  lifediff_pgdata:
