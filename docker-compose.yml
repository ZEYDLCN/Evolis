services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evolis
      POSTGRES_PASSWORD: evolis
      POSTGRES_DB: evolis
    ports:
      - "5432:5432"
    volumes:
      - evolis_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  evolis-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://evolis:evolis@postgres:5432/evolis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  evolis-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://evolis:evolis@postgres:5432/evolis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  evolis-frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  evolis_pgdata:
