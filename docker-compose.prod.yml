# Production stack. Differences from docker-compose.yml (local dev):
#   - Postgres/Redis ports are NOT published to the host — only reachable
#     from other containers on the compose network.
#   - The frontend builds its optimized production bundle (Dockerfile,
#     not Dockerfile.dev) with the real API URL baked in at build time.
#   - restart: unless-stopped on every long-running service.
#   - All secrets/config come from .env.production (see .env.production.example).
#
# Usage:
#   cp .env.production.example .env.production   # then fill it in
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# See DEPLOYMENT.md for the full walkthrough (TLS/reverse proxy, backups,
# migrations, scaling notes).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-evolis}
    volumes:
      - evolis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolis_redisdata:/data

  evolis-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evolis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolis}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000" # put a reverse proxy (nginx/Caddy/Traefik) in front for TLS
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  evolis-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evolis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolis}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  evolis-frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set, e.g. https://api.evolis.example}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # put a reverse proxy (nginx/Caddy/Traefik) in front for TLS
    depends_on:
      - evolis-api

volumes:
  evolis_pgdata:
  evolis_redisdata:
